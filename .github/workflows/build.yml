name: build

on:
  workflow_dispatch:

env:
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: set up android sdk
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: install NDK and CMake
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null 2>&1 || true

      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build debug apk
        run: ./gradlew assembleDebug --no-configuration-cache

      - name: rename apk
        run: mv app/build/outputs/apk/debug/*.apk X44.apk

      - name: upload apk
        uses: actions/upload-artifact@v7
        with:
          path: X44.apk
          archive: false
          retention-days: 30
